<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">DATABASE ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">PostgreSQL Relational Schema &amp; Key Constraints</text>

  <!-- USER TABLE -->
  <g transform="translate(60, 90)">
    <rect width="220" height="210" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="220" height="32" rx="12" fill="url(#headerGrad)"/>
    <text x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">USER</text>
    
    <text x="15" y="55" fill="#f8fafc" font-size="11">🔑 <tspan font-weight="700">id</tspan>: UUID (PK)</text>
    <text x="15" y="78" fill="#f8fafc" font-size="11">👤 <tspan font-weight="600">name</tspan>: String (6-60)</text>
    <text x="15" y="101" fill="#f8fafc" font-size="11">📧 <tspan font-weight="600">email</tspan>: String (Unique)</text>
    <text x="15" y="124" fill="#f8fafc" font-size="11">🔒 <tspan font-weight="600">passwordHash</tspan>: String</text>
    <text x="15" y="147" fill="#f8fafc" font-size="11">📍 <tspan font-weight="600">address</tspan>: String (400)</text>
    <text x="15" y="170" fill="#60a5fa" font-size="11">🏷️ <tspan font-weight="700">role</tspan>: Enum Role</text>
    <text x="15" y="193" fill="#94a3b8" font-size="10">🕒 createdAt / updatedAt</text>
  </g>

  <!-- STORE TABLE -->
  <g transform="translate(340, 90)">
    <rect width="220" height="190" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="220" height="32" rx="12" fill="#059669"/>
    <text x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">STORE</text>
    
    <text x="15" y="55" fill="#f8fafc" font-size="11">🔑 <tspan font-weight="700">id</tspan>: UUID (PK)</text>
    <text x="15" y="78" fill="#f8fafc" font-size="11">🏪 <tspan font-weight="600">name</tspan>: String</text>
    <text x="15" y="101" fill="#f8fafc" font-size="11">📧 <tspan font-weight="600">email</tspan>: String (Unique)</text>
    <text x="15" y="124" fill="#f8fafc" font-size="11">📍 <tspan font-weight="600">address</tspan>: String (400)</text>
    <text x="15" y="147" fill="#34d399" font-size="11">🔗 <tspan font-weight="700">ownerId</tspan>: UUID (FK)</text>
    <text x="15" y="172" fill="#94a3b8" font-size="10">🕒 createdAt / updatedAt</text>
  </g>

  <!-- RATING TABLE -->
  <g transform="translate(620, 90)">
    <rect width="220" height="210" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="220" height="32" rx="12" fill="#d97706"/>
    <text x="110" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">RATING</text>
    
    <text x="15" y="55" fill="#f8fafc" font-size="11">🔑 <tspan font-weight="700">id</tspan>: UUID (PK)</text>
    <text x="15" y="78" fill="#f59e0b" font-size="11">⭐ <tspan font-weight="700">value</tspan>: Int (1 to 5)</text>
    <text x="15" y="101" fill="#f8fafc" font-size="11">💬 <tspan font-weight="600">comment</tspan>: Text (500)</text>
    <text x="15" y="124" fill="#60a5fa" font-size="11">🔗 <tspan font-weight="700">userId</tspan>: UUID (FK)</text>
    <text x="15" y="147" fill="#34d399" font-size="11">🔗 <tspan font-weight="700">storeId</tspan>: UUID (FK)</text>
    <text x="15" y="170" fill="#fca5a5" font-size="10">⚡ Unique (userId, storeId)</text>
    <text x="15" y="193" fill="#94a3b8" font-size="10">🕒 createdAt / updatedAt</text>
  </g>

  <!-- RESET TOKEN TABLE -->
  <g transform="translate(60, 340)">
    <rect width="220" height="110" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="220" height="30" rx="12" fill="#7c3aed"/>
    <text x="110" y="20" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PASSWORD_RESET_TOKEN</text>
    
    <text x="15" y="52" fill="#f8fafc" font-size="11">🔑 <tspan font-weight="700">id</tspan>: UUID (PK)</text>
    <text x="15" y="72" fill="#f8fafc" font-size="11">🎫 <tspan font-weight="600">token</tspan>: String (Unique)</text>
    <text x="15" y="92" fill="#60a5fa" font-size="11">🔗 <tspan font-weight="700">userId</tspan>: UUID (FK)</text>
  </g>

  <!-- RELATION CONNECTORS -->
  <!-- User owns Store -->
  <path d="M 280 180 L 340 180" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="310" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">1 : N</text>

  <!-- Store has Ratings -->
  <path d="M 560 180 L 620 180" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="590" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">1 : N</text>

  <!-- User submits Ratings -->
  <path d="M 170 300 L 170 320 L 730 320 L 730 300" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="450" y="335" text-anchor="middle" fill="#f59e0b" font-size="10">User submits Ratings (1 : N)</text>

  <!-- User has Token -->
  <path d="M 110 300 L 110 340" stroke="#8b5cf6" stroke-width="2"/>
</svg>
